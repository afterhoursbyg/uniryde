services:
  api:
    build: .
    command: pnpm run dev
    ports:
      - "5050:5050"
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uniryde
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8.2-alpine

volumes:
  pgdata:
